# GNPC Webcam Configuration
# This file defines all webcam and overlay configurations
#
# The x=185 on every `subname: nps` logo exists because nps.gov's webcam index
# displays our frames with object-fit: cover in a ~1.43:1 box, cropping the sides
# off a 16:9 frame. That crop is 189px per side at the widest layout and grows to
# ~205px on narrow screens, so the logo starts at 185 to keep its shading running
# to the visible edge at every width — shading hidden under the crop costs nothing,
# a gap between the crop edge and the logo is what shows. Re-measure if NPS
# restyles: the crop is (naturalWidth * scale - boxWidth) / scale / 2.

webcams:

  - name: dark_sky
    file_name_on_server: stmaryallsky-resize.jpg
    logo_placements:
      - type: logo
        place: [0, 604]
        size: [299, 68]
        subname: nps
        cover_date: true
      - type: logo
        place: [0, 619]
        size: [299, 68]
        cover_date: true

  - name: lpp
    file_name_on_server: lpp.jpg
    logo_placements:
      # NPS feed: logo only, no conditions badge.
      - - type: logo
          place: [185, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
          subname: nps
      # GNPC feed: logo plus the Logan Pass conditions badge.
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 192039  # PurpleAir "Logan Pass"

  - name: smv
    file_name_on_server: smv.jpg
    # Temporary: camera was bumped/aimed wrong. Set false to restore the live feed.
    blackout: true
    logo_placements:
      # Grouped placements: add more overlays to a group to composite them
      # into a single output image (see webcams-temperature.yaml for an
      # example with a temperature overlay)
      - - type: logo
          place: [185, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
          subname: nps
          cover_date: false
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
          cover_date: false
        - type: air_quality
          sensor_index: 192039  # PurpleAir "Logan Pass"

  - name: hlt
    file_name_on_server: hlt.jpg
    logo_placements:
      # NPS feed: logo only, no conditions badge.
      - - type: logo
          place: [185, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
          subname: nps
      # GNPC feed: logo plus the Logan Pass conditions badge.
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 192039  # PurpleAir "Logan Pass"

  - name: mg
    file_name_on_server: mg.jpg
    logo_placements:
      # NPS feed: logo only, no air quality widget.
      - - type: logo
          place: [185, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
          subname: nps
      # GNPC feed: logo plus the Many Glacier Ranger Station conditions badge.
      # It sits bottom-right over the lake, where it hides nothing — the top
      # corner covered the ridgeline.
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 111457  # PurpleAir "Many Glacier Ranger Station"

  # Two Medicine comes straight from the NPS webcam page rather than the
  # glacier.org FTP server (used with NPS's permission). NPS burns its own
  # title/timestamp bar into the top-left corner, so this feed doesn't stamp
  # its own date.
  - name: tm
    url: https://www.nps.gov/webcams-glac/TwoMedicine.jpg
    logo_placements:
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 192041  # PurpleAir "Two Medicine", 0.1 mi from the camera

  # St. Mary, looking up the valley from the visitor center — also republished
  # from the NPS webcam page with their permission, and a different camera from
  # smv (which looks the other way, down the valley from Logan Pass). NPS burns
  # its own caption/timestamp into the top edge, so no date is stamped here.
  - name: stmary
    url: https://www.nps.gov/webcams-glac/StMaryPTZ.jpg
    logo_placements:
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 83937  # PurpleAir "St. Mary - Visitor Center"
          # That sensor's temperature/humidity module reports nothing, so the
          # field is not bought. Drop this line if the module is ever repaired
          # and the badge will show temperature again.
          show_temperature: false

  # West-side cameras, all republished from the NPS webcam page with their
  # permission, same origin as tm and stmary. Every one burns its own caption
  # and timestamp into the top edge, so none stamps a date, and NPS hosts the
  # originals, so none needs an `_nps` variant.
  #
  # They come in three frame sizes and both overlays are sized proportionally
  # in each, so every feed carries the same-looking furniture once the site
  # displays them at a common width. The logo is 31.9% of the frame width with
  # its bottom edge flush: 1920x1080 uses the standard [0, 944] / [612, 137],
  # 1280x720 uses [0, 630] / [408, 91], 1600x1200 uses [0, 1087] / [510, 114].
  # The badge is measured in pixels of a 1080p frame, so the other two sizes
  # set `scale` to their width over 1920 (0.67 and 0.83).
  #
  # All eight share PurpleAir 111211 ("MT05 - West Glacier", 0.9 mi from Apgar
  # Village), falling back to 190835 ("Lake McDonald - Apgar", at the foot of
  # the lake) when it goes offline — which it does for days at a time. The
  # per-sensor cache means the eight of them cost one API call per run, not
  # eight.

  - name: apgar_mtn
    # Slower refresh than the rest — its frame can be hours old while the
    # others are within a minute. That is the camera, not the pipeline.
    url: https://www.nps.gov/webcams-glac/ApgarLookout-01.jpg
    logo_placements:
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 111211  # PurpleAir "MT05 - West Glacier"
          fallback_sensors: [190835]  # PurpleAir "Lake McDonald - Apgar"

  - name: apgar_village
    url: https://www.nps.gov/webcams-glac/ApgarVillage.jpg
    logo_placements:
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 111211  # PurpleAir "MT05 - West Glacier"
          fallback_sensors: [190835]  # PurpleAir "Lake McDonald - Apgar"

  - name: lake_mcdonald
    url: https://www.nps.gov/webcams-glac/LakeMcDonald1.jpg
    logo_placements:
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 111211  # PurpleAir "MT05 - West Glacier"
          fallback_sensors: [190835]  # PurpleAir "Lake McDonald - Apgar"

  # NPS re-aims this PTZ periodically, so don't assume the framing is fixed.
  - name: lake_mcdonald2
    url: https://www.nps.gov/webcams-glac/lakemcdonaldptz.jpg
    logo_placements:
      - - type: logo
          place: [0, 630]
          size: [408, 91]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 111211  # PurpleAir "MT05 - West Glacier"
          fallback_sensors: [190835]  # PurpleAir "Lake McDonald - Apgar"
          scale: 0.67  # 1280x720 frame

  - name: apgar_visitor_center
    url: https://www.nps.gov/webcams-glac/ApgarVisitorCenter.jpg
    logo_placements:
      - - type: logo
          place: [0, 1087]
          size: [510, 114]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 111211  # PurpleAir "MT05 - West Glacier"
          fallback_sensors: [190835]  # PurpleAir "Lake McDonald - Apgar"
          scale: 0.83  # 1600x1200 frame

  - name: middle_fork
    url: https://www.nps.gov/webcams-glac/MiddleForkBridge.jpg
    logo_placements:
      - - type: logo
          place: [0, 630]
          size: [408, 91]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 111211  # PurpleAir "MT05 - West Glacier"
          fallback_sensors: [190835]  # PurpleAir "Lake McDonald - Apgar"
          scale: 0.67  # 1280x720 frame

  - name: headquarters
    url: https://www.nps.gov/webcams-glac/Headquarters.jpg
    logo_placements:
      - - type: logo
          place: [0, 1087]
          size: [510, 114]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 111211  # PurpleAir "MT05 - West Glacier"
          fallback_sensors: [190835]  # PurpleAir "Lake McDonald - Apgar"
          scale: 0.83  # 1600x1200 frame

  - name: west_entrance
    url: https://www.nps.gov/webcams-glac/WestEntrance.jpg
    logo_placements:
      - - type: logo
          place: [0, 1087]
          size: [510, 114]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 111211  # PurpleAir "MT05 - West Glacier"
          fallback_sensors: [190835]  # PurpleAir "Lake McDonald - Apgar"
          scale: 0.83  # 1600x1200 frame

allsky_videos:
  - name: allsky
    file_name_on_server: allsky.mp4
    logo_place: [0, 619]
