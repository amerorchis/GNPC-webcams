    file_name_on_server: depot.jpg
    logo_placements:
      - type: logo
        place: [0, 0]
        size: [1, 1]
        cover_date: false

  - name: stuck
    file_name_on_server: stuck.jpg
    logo_placements:
      - type: logo
        place: [0, 944]
