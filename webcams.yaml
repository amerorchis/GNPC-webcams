# GNPC Webcam Configuration
# This file defines all webcam and overlay configurations

webcams:

  - name: dark_sky
    file_name_on_server: stmaryallsky-resize.jpg
    logo_placements:
      # NPS feed: logo and timestamp only, no conditions badge.
      - - type: logo
          place: [0, 604]
          size: [299, 68]
          subname: nps
          cover_date: true
      # GNPC feed: adds the St. Mary conditions badge, in the corner outside
      # the fisheye circle where it covers no sky.
      - - type: logo
          place: [0, 619]
          size: [299, 68]
          cover_date: true
        - type: air_quality
          sensor_index: 83937  # PurpleAir "St. Mary - Visitor Center"
          # See the stmary entry: that sensor reports no temperature, so the
          # field is not bought here either.
          show_temperature: false

  - name: lpp
    file_name_on_server: lpp.jpg
    logo_placements:
      - type: logo
        place: [140, 944]
        size: [612, 137]
        img: overlays/logo-shaded.png
        subname: nps
      - type: logo
        place: [0, 944]
        size: [612, 137]
        img: overlays/logo-shaded.png

  - name: smv
    file_name_on_server: smv.jpg
    # Temporary: camera was bumped/aimed wrong. Set false to restore the live feed.
    blackout: true
    logo_placements:
      # Grouped placements: add more overlays to a group to composite them
      # into a single output image (see webcams-temperature.yaml for an
      # example with a temperature overlay)
      - - type: logo
          place: [140, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
          subname: nps
          cover_date: false
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
          cover_date: false

  - name: hlt
    file_name_on_server: hlt.jpg
    logo_placements:
      - type: logo
        place: [140, 944]
        size: [612, 137]
        img: overlays/logo-shaded.png
        subname: nps
      - type: logo
        place: [0, 944]
        size: [612, 137]
        img: overlays/logo-shaded.png

  - name: mg
    file_name_on_server: mg.jpg
    logo_placements:
      # NPS feed: logo only, no air quality widget.
      - - type: logo
          place: [140, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
          subname: nps
      # GNPC feed: logo plus the Many Glacier Ranger Station conditions badge.
      # It sits bottom-right over the lake, where it hides nothing — the top
      # corner covered the ridgeline.
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 111457  # PurpleAir "Many Glacier Ranger Station"

  # Two Medicine comes straight from the NPS webcam page rather than the
  # glacier.org FTP server (used with NPS's permission). NPS burns its own
  # title/timestamp bar into the top-left corner, so this feed doesn't stamp
  # its own date.
  - name: tm
    url: https://www.nps.gov/webcams-glac/TwoMedicine.jpg
    logo_placements:
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 192041  # PurpleAir "Two Medicine", 0.1 mi from the camera

  # St. Mary, looking up the valley from the visitor center — also republished
  # from the NPS webcam page with their permission, and a different camera from
  # smv (which looks the other way, down the valley from Logan Pass). NPS burns
  # its own caption/timestamp into the top edge, so no date is stamped here.
  - name: stmary
    url: https://www.nps.gov/webcams-glac/StMaryPTZ.jpg
    logo_placements:
      - - type: logo
          place: [0, 944]
          size: [612, 137]
          img: overlays/logo-shaded.png
        - type: air_quality
          sensor_index: 83937  # PurpleAir "St. Mary - Visitor Center"
          # That sensor's temperature/humidity module reports nothing, so the
          # field is not bought. Drop this line if the module is ever repaired
          # and the badge will show temperature again.
          show_temperature: false

allsky_videos:
  - name: allsky
    file_name_on_server: allsky.mp4
    logo_place: [0, 619]
    logo_size: [299, 68]

unused:
  - name: depot
    file_name_on_server: depot.jpg
    logo_placements:
      - type: logo
        place: [0, 0]
        size: [1, 1]
        cover_date: false

  - name: stuck
    file_name_on_server: stuck.jpg
    logo_placements:
      - type: logo
        place: [0, 944]
        size: [612, 137]
        img: overlays/logo-shaded.png