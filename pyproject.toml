[project]
name = "gnpc-webcams"
version = "0.1.0"
description = "Brands and republishes the Glacier National Park Conservancy webcam feeds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "pillow>=11.3.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/manual"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
